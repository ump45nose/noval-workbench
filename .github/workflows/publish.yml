name: publish

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve upstream revision
        id: src
        run: |
          sha=$(git ls-remote https://github.com/ump45nose/SillyTavern.git refs/heads/main | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ -f .source-sha ] && [ "$(cat .source-sha)" = "$sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout upstream source
        if: steps.src.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ump45nose/SillyTavern
          ref: main
          path: src
      - name: Set up Node
        if: steps.src.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install dependencies
        if: steps.src.outputs.changed == 'true'
        run: npm ci
        working-directory: src
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Build extension
        if: steps.src.outputs.changed == 'true'
        run: node scripts/build.mjs
        working-directory: src
      - name: Publish
        if: steps.src.outputs.changed == 'true'
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name src -exec rm -rf {} +
          cp -a src/extension/. .
          echo "${{ steps.src.outputs.sha }}" > .source-sha
          rm -rf src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "publish from ump45nose/SillyTavern@${{ steps.src.outputs.sha }}" || exit 0
          git push
